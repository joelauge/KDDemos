# Deploys the KnowBot API (cloudflare/: Worker + Container with llama-server and the Node server).
# Repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, KNOWDRIVE_API_KEY.
name: Deploy KnowBot API to Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['cloudflare/**', 'lib/**', 'server/**', 'corpus/**', '.github/workflows/deploy-cloudflare.yml']
concurrency: { group: cloudflare-deploy, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: guard
        env: { T: '${{ secrets.CLOUDFLARE_API_TOKEN }}', A: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}' }
        run: |
          if [ -z "$T" ] || [ -z "$A" ]; then echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping deploy"; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ok == 'true'
        with: { node-version: 22 }
      - name: Install
        if: steps.guard.outputs.ok == 'true'
        working-directory: cloudflare
        run: npm install --no-audit --no-fund
      - name: Deploy (builds the container image with Docker)
        if: steps.guard.outputs.ok == 'true'
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Set the knowDrive key as a Worker secret
        if: steps.guard.outputs.ok == 'true'
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KNOWDRIVE_API_KEY: ${{ secrets.KNOWDRIVE_API_KEY }}
        run: |
          if [ -n "$KNOWDRIVE_API_KEY" ]; then printf '%s' "$KNOWDRIVE_API_KEY" | npx wrangler secret put KNOWDRIVE_API_KEY; else echo "::warning::KNOWDRIVE_API_KEY not set; the container will answer from the bundled corpus"; fi
