# Deploys the KnowBot API (cloudflare/: Worker + Container with llama-server and the Node server).
# Secrets (on the github-pages environment, or as repository secrets): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# KNOWDRIVE_API_KEY (the store the bot answers from) and KNOWBOT_ADMIN_TOKEN (dashboard instance management).
# Optional (phone/SMS channels): GEMINI_API_KEY, TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM_NUMBER.
# Optional (KnowBot numbers bought in the Studio): STRIPE_RESTRICTED_KEY (preferred) or STRIPE_SECRET_KEY, STRIPE_PUBLISHABLE_KEY, STRIPE_WEBHOOK_SECRET.
# Optional (the KnowBot plan's own checkout, server/billing.mjs): the payments key above (STRIPE_RESTRICTED_KEY or
# STRIPE_SECRET_KEY) turns it on; KNOWBOT_BILLING_WEBHOOK_SECRET is the signing secret of the webhook endpoint
# https://agent.knowbot.app/api/studio/billing/webhook. Without a payments key the Launch sheet says checkout isn't
# available yet.
# Optional (evidence selector): GITLAB_TOKEN (read_api + read_repository on the engine project), used only to fetch the
# engine source at build time; turn the selector on with the plain var KNOWBOT_EVIDENCE=attend (wrangler.jsonc vars).
name: Deploy KnowBot API to Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['cloudflare/**', 'lib/**', 'server/**', 'corpus/**', 'attendd/**', 'scripts/fetch-engine.sh', '.github/workflows/deploy-cloudflare.yml']
concurrency: { group: cloudflare-deploy, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages # its secrets hold the Cloudflare credentials; restricted to main
    steps:
      - name: Check secrets
        id: guard
        env: { T: '${{ secrets.CLOUDFLARE_API_TOKEN }}', A: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}' }
        run: |
          if [ -z "$T" ] || [ -z "$A" ]; then echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping deploy"; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ok == 'true'
        with: { node-version: 22 }
      - name: Install
        if: steps.guard.outputs.ok == 'true'
        working-directory: cloudflare
        run: npm install --no-audit --no-fund
      - name: Set the knowDrive key as a Worker secret (before deploy, so new containers start with it)
        if: steps.guard.outputs.ok == 'true'
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KNOWDRIVE_API_KEY: ${{ secrets.KNOWDRIVE_API_KEY }}
          KNOWBOT_ADMIN_TOKEN: ${{ secrets.KNOWBOT_ADMIN_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_RESTRICTED_KEY: ${{ secrets.STRIPE_RESTRICTED_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          KNOWBOT_BILLING_WEBHOOK_SECRET: ${{ secrets.KNOWBOT_BILLING_WEBHOOK_SECRET }}
        run: |
          if [ -n "$KNOWDRIVE_API_KEY" ]; then printf '%s' "$KNOWDRIVE_API_KEY" | npx wrangler secret put KNOWDRIVE_API_KEY; else echo "::warning::KNOWDRIVE_API_KEY not set; the container will answer from the bundled corpus"; fi
          if [ -n "$ANTHROPIC_API_KEY" ]; then printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY; else echo "::notice::ANTHROPIC_API_KEY not set; the Studio Builder uses its scripted engine"; fi
          if [ -n "$RESEND_API_KEY" ]; then printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY; else echo "::notice::RESEND_API_KEY not set; bots offer to send answers by text only"; fi
          # Phone + SMS channels (optional; each feature stays off without its secret)
          for n in GEMINI_API_KEY TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN TWILIO_FROM_NUMBER STRIPE_SECRET_KEY STRIPE_RESTRICTED_KEY STRIPE_PUBLISHABLE_KEY STRIPE_WEBHOOK_SECRET; do
            v="${!n}"; if [ -n "$v" ]; then printf '%s' "$v" | npx wrangler secret put "$n"; else echo "::notice::$n not set; the phone/SMS feature that needs it stays off"; fi
          done
          # The KnowBot plan's checkout (optional): its webhook's signing secret
          if [ -n "$KNOWBOT_BILLING_WEBHOOK_SECRET" ]; then printf '%s' "$KNOWBOT_BILLING_WEBHOOK_SECRET" | npx wrangler secret put KNOWBOT_BILLING_WEBHOOK_SECRET; else echo "::notice::KNOWBOT_BILLING_WEBHOOK_SECRET not set; a paid checkout is only confirmed when the customer returns to the Studio, and cancellations or failed payments are not seen"; fi
          if [ -n "$KNOWBOT_ADMIN_TOKEN" ]; then printf '%s' "$KNOWBOT_ADMIN_TOKEN" | npx wrangler secret put KNOWBOT_ADMIN_TOKEN; else echo "::warning::KNOWBOT_ADMIN_TOKEN not set; chat instances can't be created or edited from the dashboard"; fi
      - name: Fetch the evidence engine source (optional; never committed, never passed to the Worker)
        if: steps.guard.outputs.ok == 'true'
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then echo "::notice::GITLAB_TOKEN not set; the image is built without attendd (answers use the search path)"; exit 0; fi
          scripts/fetch-engine.sh || echo "::warning::engine fetch failed; the image is built without attendd"
      - name: Deploy (builds the container image with Docker)
        if: steps.guard.outputs.ok == 'true'
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --var KNOWBOT_BUILD:${{ github.sha }}
