<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>KnowBot Chat</title>
  <meta name="description" content="Full-page KnowBot chat that answers from The Ultimate Game Master's knowDrive and cites every source." />
  <meta name="color-scheme" content="light dark" />
  <script>/* theme before first paint: light by default, dark if chosen (localStorage 'knowbot-theme') */
    (function () { var t = 'light'; try { var s = localStorage.getItem('knowbot-theme'); if (s === 'dark' || s === 'light') t = s; } catch (e) {} document.documentElement.setAttribute('data-theme', t); })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="./demo.css?v=c2b1375" />
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; }
    #chat { flex: 1; min-height: 0; display: flex; }
    #chat > .kb-root { flex: 1; min-height: 0; height: auto; }
    #chat .kb-mode-fullpage { min-height: 0; }
  </style>
</head>
<body>
  <div class="demo-bar" role="note"><div class="wrap">
    <span class="demo-bar-start"><a class="kd-brand" href="https://knowdrive.ai" aria-label="KnowDrive home"><img src="./logo.svg" alt="" width="34" height="24" /><span>KnowDrive</span></a><span><b>DEMO</b> &middot; <span data-demo-label>full-page chat &middot; The Ultimate Game Master knowDrive</span></span></span>
    <span class="demo-bar-end"><span><a data-keep-api href="./index.html">All demos</a> &middot; <span data-api-status></span></span><button type="button" class="theme-btn" data-theme-toggle aria-label="Switch to dark theme"><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></span>
  </div></div>
  <main id="chat"></main>
  <script type="module">
    import { mountFullpage } from '../lib/widget.js?v=c2b1375';
    import { API, PERSONA, COVERAGE, STARTERS, INSTANCE, instanceConfig, carryApiParam, showApiStatus } from './demo.js?v=c2b1375';
    carryApiParam();
    showApiStatus();
    const inst = await instanceConfig();
    if (inst) {
      // A chat instance: its own name, greeting and starters; answers come only from its folder.
      const org = inst.org || inst.name;
      document.title = `${org} · KnowBot`;
      document.querySelector('[data-demo-label]').textContent = `full-page chat · ${org}`;
      window.knowbot = mountFullpage('#chat', { apiBase: API, instance: INSTANCE, guards: inst.guards, persona: { name: inst.botName || 'KnowBot', org },
        greeting: inst.greeting || undefined, starters: inst.starters || [] });
    } else {
      window.knowbot = mountFullpage('#chat', { apiBase: API, persona: PERSONA, coverage: COVERAGE, starters: STARTERS });
    }
  </script>
</body>
</html>
