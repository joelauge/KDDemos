<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>KnowBot Chat</title>
  <meta name="description" content="Full-page KnowBot chat that answers from The Ultimate Game Master's knowDrive and cites every source." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="./demo.css" />
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; }
    #chat { flex: 1; min-height: 0; display: flex; }
    #chat > .kb-root { flex: 1; min-height: 0; height: auto; }
    #chat .kb-mode-fullpage { min-height: 0; }
  </style>
</head>
<body>
  <div class="demo-bar" role="note"><div class="wrap">
    <span><b>DEMO</b> &middot; full-page chat &middot; The Ultimate Game Master knowDrive</span>
    <span><a data-keep-api href="./index.html">All demos</a> &middot; <span data-api-status></span></span>
  </div></div>
  <main id="chat"></main>
  <script type="module">
    import { mountFullpage } from '../lib/widget.js';
    import { API, PERSONA, STARTERS, carryApiParam, showApiStatus } from './demo.js';
    carryApiParam();
    showApiStatus();
    window.knowbot = mountFullpage('#chat', { apiBase: API, persona: PERSONA, starters: STARTERS });
  </script>
</body>
</html>
