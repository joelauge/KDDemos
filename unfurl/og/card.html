<!DOCTYPE html>
<!-- Source for the unfurl images. Regenerate with: node render.js -->
<html><head><meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" />
<style>
  * { box-sizing: border-box; } html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #020617; color: #cbd5e1; font-family: Inter, sans-serif; position: relative; overflow: hidden; }
  .glow { position: absolute; inset: -200px -100px auto auto; width: 760px; height: 760px; background: radial-gradient(circle, rgba(99,102,241,0.35), transparent 62%); }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px); background-size: 48px 48px; mask-image: linear-gradient(180deg, transparent, #000 30%, #000 70%, transparent); }
  .in { position: absolute; inset: 0; padding: 64px 72px; display: flex; flex-direction: column; }
  .lock { display: flex; align-items: center; gap: 16px; }
  .lock img { height: 40px; }
  .lock span { font-family: 'Plus Jakarta Sans'; font-weight: 700; font-size: 32px; color: #f8fafc; letter-spacing: -0.5px; }
  .kick { font-family: 'JetBrains Mono'; color: #818cf8; font-size: 20px; letter-spacing: 4px; text-transform: uppercase; margin-top: 56px; }
  h1 { font-family: 'Plus Jakarta Sans'; font-weight: 800; font-size: 64px; line-height: 1.05; color: #f8fafc; margin: 14px 0 0; letter-spacing: -1.5px; }
  .box { margin-top: auto; padding: 5px; border-radius: 26px; background: linear-gradient(135deg, rgba(99,102,241,0.9), rgba(129,140,248,0.25) 45%, rgba(255,255,255,0.12)); }
  .box-in { background: #0f172a; border-radius: 21px; height: 104px; display: flex; align-items: center; padding: 0 16px 0 32px; gap: 22px; }
  .box-in .ph { flex: 1; font-size: 34px; color: #64748b; }
  .box-in .ph b { color: #f8fafc; font-weight: 400; }
  .caret { display: inline-block; width: 3px; height: 38px; background: #818cf8; vertical-align: -6px; margin-left: 2px; }
  svg { width: 38px; height: 38px; stroke: #94a3b8; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .go { width: 76px; height: 76px; border-radius: 16px; background: #6366f1; display: flex; align-items: center; justify-content: center; }
  .go svg { stroke: #fff; }
  .stats { display: flex; gap: 28px; margin-top: 22px; font-size: 22px; color: #94a3b8; }
  .stats i { font-style: normal; color: #34d399; }
  /* result variant */
  .q { margin-top: 34px; padding-left: 28px; border-left: 5px solid #6366f1; font-size: 34px; line-height: 1.45; color: #f8fafc; font-weight: 300; }
  .by { margin-top: auto; font-size: 24px; color: #94a3b8; }
  .by b { color: #f8fafc; font-weight: 500; }
  /* icon variant */
  body.icon { width: 180px; height: 180px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #312e81, #020617); }
  body.icon img { width: 120px; }
</style></head>
<body>
<script>
  const v = new URLSearchParams(location.search).get('v') || 'search';
  const icon = (d) => '<svg viewBox="0 0 24 24">' + d + '</svg>';
  if (v === 'icon') { document.body.className = 'icon'; document.body.innerHTML = '<img src="../../logo.svg">'; }
  else if (v === 'search') document.body.innerHTML = '<div class="glow"></div><div class="grid"></div><div class="in">' +
    '<div class="lock"><img src="../../logo.svg"><span>KnowDrive</span></div>' +
    '<div class="kick">Shared knowledge store</div><h1>Canada · Public Record</h1>' +
    '<div class="box"><div class="box-in">' + icon('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>').replace('#94a3b8', '') +
      '<div class="ph"><b>AI regulation testimony</b><span class="caret"></span></div>' +
      icon('<rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>') +
      icon('<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/>') +
      '<div class="go">' + icon('<path d="M5 12h14M13 6l6 6-6 6"/>') + '</div></div></div>' +
    '<div class="stats"><span><i>●</i>&nbsp; 12,090 files</span><span>391,922 atoms</span><span>text · image · voice</span></div></div>';
  else document.body.innerHTML = '<div class="glow"></div><div class="grid"></div><div class="in">' +
    '<div class="lock"><img src="../../logo.svg"><span>KnowDrive</span></div>' +
    '<div class="q">“Regulations should therefore be tiered: heavy and strict for systems that have a societal impact, but simple, pragmatic and accessible for everyday use…”</div>' +
    '<div class="by"><b>Frédéric Gonzalo</b> · ETHI Committee, Meeting 21 · Canada Public Record</div></div>';
</script>
</body></html>
